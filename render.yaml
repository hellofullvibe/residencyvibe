# Render Blueprint for the ResidencyVibe Go backend.
# Deploy: render.com -> New -> Blueprint -> select this repo.
# NOTE: NEVER put real credentials here. Set DATABASE_URL and ALLOWED_ORIGIN
# in the Render dashboard (Environment) after the first deploy.
services:
  - type: web
    name: residencyvibe-backend
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /api/meta
    envVars:
      - key: PORT
        value: 10000
      # These are dashboard-only (set in Render -> Environment):
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false