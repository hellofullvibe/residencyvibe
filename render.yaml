# Render Blueprint for the ResidencyVibe Go backend.
# Deploy: render.com -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: residencyvibe-backend
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /api/meta
    envVars:
      - key: PORT
        value: 10000
      # Set these in the Render dashboard after the first deploy:
      - key: DATABASE_URL
        sync: postgresql://postgres.inujashaktqujsvpconq:Sopno.na.11@aws-0-us-east-1.pooler.supabase.com:6543/postgres
      - key: ALLOWED_ORIGIN
        sync: https://residencyvibe.vercel.app,https://www.residencyvibe.space,http://localhost:3000